name: redis

services:
  redis:
    image: redis:7
    container_name: redis
    restart: unless-stopped
    env_file:
      - ../../secret/redis/.env
    command: ["sh", "-c", "redis-server --requirepass $$REDIS_PASSWORD --appendonly yes"]
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - ../../data/redis:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m

networks:
  backend:
    external: true
