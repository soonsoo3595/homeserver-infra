name: jenkins

services:
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ../../data/jenkins:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "989"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
