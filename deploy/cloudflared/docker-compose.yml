name: cloudflared

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    # 기본 프로토콜(QUIC/UDP)이 이 서버의 Docker 네트워크에서 반복적으로
    # "timeout: no recent network activity"로 끊겨서(홈서버 특유의
    # MTU/PMTU 문제, HomeServer/CLAUDE.md 참고) TCP 기반 http2로 고정.
    command: tunnel --protocol http2 run
    env_file:
      - ../../secret/cloudflared/.env
    # cloudflared 이미지는 셸조차 없는 최소 이미지라 컨테이너 안에서 도는
    # Docker HEALTHCHECK를 못 만든다. 대신 이 포트(cloudflared 자체 metrics
    # 서버의 /ready)를 호스트로 열어서 healthcheck.sh가 cron으로 밖에서
    # 찔러보고 죽어있으면 재시작시킨다 (자세한 배경은 healthcheck.sh 참고).
    ports:
      - "127.0.0.1:20241:20241"
    networks:
      - proxy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128m

networks:
  proxy:
    external: true
