name: blog-web

services:
  blog-web:
    image: blog-web:latest
    container_name: blog-web
    restart: unless-stopped
    env_file:
      - ../../secret/blog-web/.env
    networks:
      - proxy
      - backend
    # Traefik 라우팅은 라벨이 아니라 deploy/traefik/dynamic/blog-web.yml
    # (파일 기반 provider)에 정의되어 있음 - 이유는 deploy/traefik/docker-compose.yml 주석 참고.
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768m

networks:
  proxy:
    external: true
  backend:
    external: true
