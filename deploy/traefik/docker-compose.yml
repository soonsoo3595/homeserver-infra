name: traefik

services:
  traefik:
    image: traefik:v3.5
    container_name: traefik
    restart: unless-stopped
    # 원래는 --providers.docker(라벨 기반 자동 라우팅)를 썼는데, 최신 Docker
    # 엔진(API 1.55, 최소 지원 1.40)과 Traefik이 내부적으로 요청하는 옛 API
    # 버전(1.24)이 맞지 않아 "client version too old"로 컨테이너를 아예 못
    # 찾는 문제가 있었다(v3.1/v3.5 둘 다 동일). docker.sock 자체가 필요 없는
    # 파일 기반 정적 라우팅(providers.file)으로 대체 - 새 서비스 추가 시
    # dynamic/ 아래에 라우터/서비스 정의 파일을 추가하면 된다.
    command:
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--api.insecure=true"
    ports:
      - "80:80"
      - "127.0.0.1:8080:8080"
    volumes:
      - ./dynamic:/etc/traefik/dynamic:ro
    networks:
      - proxy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

networks:
  proxy:
    external: true
